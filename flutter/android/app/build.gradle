plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "com.example.cy_vpn"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.example.cy_vpn"
        minSdk 21
        targetSdk flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        // 体积优化关键：只保留 arm64 架构
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    flavorDimensions "app"
    productFlavors {
        vpn {
            dimension "app"
            applicationId "com.example.cy_vpn"
            resValue "string", "app_name", "9点9 VPN"
            manifestPlaceholders = [appLabel: "9点9 VPN"]
        }
        acc {
            dimension "app"
            applicationId "com.example.cy_acc"
            resValue "string", "app_name", "9点9 加速器"
            manifestPlaceholders = [appLabel: "9点9 加速器"]
        }
    }

    signingConfigs {
        release {
            def storeFilePath = localProperties.getProperty('release.storeFile')
            if (storeFilePath != null) {
                storeFile file(storeFilePath)
                storePassword localProperties.getProperty('release.storePassword')
                keyAlias localProperties.getProperty('release.keyAlias')
                keyPassword localProperties.getProperty('release.keyPassword')
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            // 开启混淆和资源压缩
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    // implementation project(path: ':v2ray')
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
