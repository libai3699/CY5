<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QQ客服</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #fff1f2, #ffd6df, #ffeef5);
      color: #881337;
    }

    main {
      padding: 28px 22px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 26px;
    }

    .box {
      margin-top: 18px;
      padding: 18px;
      border-radius: 8px;
      background: rgba(255, 255, 255, .82);
      border: 1px solid rgba(255, 255, 255, .9);
    }

    .qq {
      font-size: 22px;
      font-weight: 800;
      color: #e11d48;
    }
  </style>
</head>

<body>
  <main>
    <h1>9点9 VPN 客服</h1>
    <p>这里是项目内嵌 H5 页面，后续可以替换为真实客服、公告或帮助中心。</p>
    <section class="box">
      <div>QQ客服</div>
      <div class="qq">123456789</div>
    </section>
    <section class="box">
      <div>服务时间</div>
      <p>每天 10:00 - 22:00</p>
    </section>
  </main>
</body>

</html>
